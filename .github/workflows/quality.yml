name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.14.4-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "nc -z 127.0.0.1 4222"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_NATS_URL: nats://127.0.0.1:4222
      TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/server/go.mod
          cache: true
          cache-dependency-path: |
            apps/server/go.sum
            apps/server-ai/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - name: Run full backend quality gate
        run: python .claude/skills/dev-quality-gate/scripts/check_gates.py --scope backend --full

  database-dialects:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-mysql-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/server/go.mod
          cache: true
      - name: Verify MySQL IAM lifecycle and behavior
        env:
          IAM_DB_LIFECYCLE_TYPE: mysql
          IAM_DB_LIFECYCLE_ADMIN_DSN: "root:ci-mysql-password@tcp(127.0.0.1:3306)/mysql?multiStatements=true&parseTime=true"
        run: go test -race ./internal/modules/iam -run 'Test(MigrationDialectLifecycle|ServiceDialectContract)$' -count=1 -v
      - name: Verify MySQL provisioning lifecycle
        env:
          IAM_DB_LIFECYCLE_TYPE: mysql
          IAM_DB_LIFECYCLE_ADMIN_DSN: "root:ci-mysql-password@tcp(127.0.0.1:3306)/mysql?multiStatements=true&parseTime=true"
        run: go test -race ./internal/modules/provisioning -run TestProvisioningMigrationDialectLifecycle -count=1 -v
      - name: Verify MySQL AI workspace and machine lifecycle
        working-directory: apps/server-ai
        env:
          AI_DB_LIFECYCLE_TYPE: mysql
          AI_DB_LIFECYCLE_ADMIN_DSN: "root:ci-mysql-password@tcp(127.0.0.1:3306)/mysql?multiStatements=true&parseTime=true"
        run: go test -race ./internal/modules/workspace -run TestWorkspaceAndMachineMigrationDialectLifecycle -count=1 -v
      - name: Verify PostgreSQL IAM lifecycle and behavior
        env:
          IAM_DB_LIFECYCLE_TYPE: postgres
          IAM_DB_LIFECYCLE_ADMIN_DSN: "postgres://postgres:ci-postgres-password@127.0.0.1:5432/postgres?sslmode=disable"
        run: go test -race ./internal/modules/iam -run 'Test(MigrationDialectLifecycle|ServiceDialectContract)$' -count=1 -v
      - name: Verify PostgreSQL provisioning lifecycle
        env:
          IAM_DB_LIFECYCLE_TYPE: postgres
          IAM_DB_LIFECYCLE_ADMIN_DSN: "postgres://postgres:ci-postgres-password@127.0.0.1:5432/postgres?sslmode=disable"
        run: go test -race ./internal/modules/provisioning -run TestProvisioningMigrationDialectLifecycle -count=1 -v
      - name: Verify PostgreSQL AI workspace and machine lifecycle
        working-directory: apps/server-ai
        env:
          AI_DB_LIFECYCLE_TYPE: postgres
          AI_DB_LIFECYCLE_ADMIN_DSN: "postgres://postgres:ci-postgres-password@127.0.0.1:5432/postgres?sslmode=disable"
        run: go test -race ./internal/modules/workspace -run TestWorkspaceAndMachineMigrationDialectLifecycle -count=1 -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - name: Run frontend quality gate
        run: python .claude/skills/dev-quality-gate/scripts/check_gates.py --scope frontend

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - name: Run full documentation quality gate
        env:
          DOC_PASSWORD: ci-only-documentation-password
        run: python .claude/skills/dev-quality-gate/scripts/check_gates.py --scope docs --full

  containers:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: chaosplus-ci
      APP_DOMAIN: app.localhost
      APP_URL: http://app.localhost
      PUBLIC_PORT: "8080"
      INITIAL_TENANT_ID: platform
      INITIAL_ADMIN_LOGIN: admin@example.invalid
      INITIAL_ADMIN_DISPLAY_NAME: CI Admin
      POSTGRES_IMAGE: postgres:17.5-alpine
      REDIS_IMAGE: redis:8.0.3-alpine
      TRAEFIK_IMAGE: traefik:v3.6.4
      POSTGRES_ADMIN_PASSWORD: ci-postgres-password
      CHAOSPLUS_MIGRATOR_PASSWORD: ci-migrator-password
      CHAOSPLUS_RUNTIME_PASSWORD: ci-runtime-password
      REDIS_PASSWORD: ci-redis-password
      ACME_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose manifests
        run: |
          docker compose -f apps/server/deploy/compose/compose.yaml config --quiet
          docker compose -f apps/server/deploy/compose/compose.yaml -f apps/server/deploy/compose/compose.tls.yaml config --quiet
      - name: Build backend image
        run: docker build --tag chaosplus:ci apps/server
      - name: Build admin image
        run: docker build --tag chaosplus-admin:ci apps/admin
      - name: Build documentation image
        run: docker build --tag dev-docs:ci apps/docs

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate repository skills
        run: python .claude/skills/dev-quality-gate/scripts/skill-runtime.py validate
      - name: Test repository skill runtime
        run: python -m unittest discover -s .claude/skills/dev-quality-gate/scripts -p 'test_*.py'
