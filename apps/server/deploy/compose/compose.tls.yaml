services:
  proxy:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${COMPOSE_PROJECT_NAME:-chaosplus}
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
      - --ping=true
    ports: ["80:80", "443:443"]
    volumes:
      - letsencrypt:/letsencrypt

  chaosplus:
    environment:
      AUTHN_WEB_COOKIE_SECURE: "true"
      SECURITY_HSTS: "true"
    labels:
      traefik.http.routers.chaosplus-api.entrypoints: websecure
      traefik.http.routers.chaosplus-api.tls: "true"
      traefik.http.routers.chaosplus-api.tls.certresolver: letsencrypt

  web:
    labels:
      traefik.http.routers.chaosplus-web.entrypoints: websecure
      traefik.http.routers.chaosplus-web.tls: "true"
      traefik.http.routers.chaosplus-web.tls.certresolver: letsencrypt

volumes:
  letsencrypt:
