server_name: chaosplus-ai
port: 4222
http_port: 8222

authorization {
  token: $NATS_AUTH_TOKEN
  timeout: 2
}

tls {
  cert_file: "/etc/nats/tls/server.crt"
  key_file: "/etc/nats/tls/server.key"
  ca_file: "/etc/nats/tls/ca.crt"
  timeout: 2
}

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 1G
  max_file_store: 20G
}

max_payload: 8MB
write_deadline: "10s"
