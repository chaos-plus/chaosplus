name: chaosplus-ai-dev

services:
  nats:
    image: ${NATS_IMAGE:-nats:2.14.4-alpine}
    command: ["--jetstream", "--store_dir", "/data/jetstream", "--http_port", "8222"]
    restart: unless-stopped
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-dev-data:/data/jetstream
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  nats-dev-data:
