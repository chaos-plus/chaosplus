<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>chaos.plus · 控制面</title>
<style>
  :root { --bg:#12141a; --panel:#1b1e26; --line:#2a2d36; --txt:#e6e8ee; --mut:#8a90a0;
          --ok:#3fb96f; --run:#d9a13c; --err:#e0564e; --wait:#4aa3e8; --skip:#5b6270; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 system-ui, sans-serif; display:flex; height:100vh }
  aside { width:240px; border-right:1px solid var(--line); padding:12px; overflow:auto }
  main { flex:1; padding:16px; overflow:auto }
  h1,h2 { margin:0 0 10px; font-weight:600 }
  input,textarea,select,button { background:#0f1116; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit }
  button { cursor:pointer }
  button.primary { background:var(--wait); color:#fff; border-color:transparent }
  .field { display:block; width:100%; margin-bottom:8px }
  .run { padding:6px 8px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; cursor:pointer }
  .run.active { border-color:var(--wait) }
  .node { display:flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--skip); flex:none }
  .dot.running{ background:var(--run) } .dot.completed{ background:var(--ok) } .dot.failed{ background:var(--err) }
  .dot.waiting_approval{ background:var(--wait); animation:pulse 1.2s infinite } .dot.skipped{ background:var(--skip) }
  .dot.rejected{ background:var(--err) }
  @keyframes pulse { 50% { opacity:.4 } }
  .meta { color:var(--mut); font-size:12px }
</style>
</head>
<body>
<aside>
  <h1>chaos.plus</h1>
  <button class="primary" onclick="showView('runs')">运行</button>
  <button onclick="showView('machines')">Machines</button>
  <h2>Runs</h2>
  <div id="runs"></div>
</aside>
<main>
  <div id="machines" style="display:none">
    <h2>Machines</h2>
    <button class="primary" onclick="machineAdd()">＋ 添加 Machine</button>
    <div id="wizard" style="display:none;border:1px solid var(--wait);border-radius:8px;padding:12px;margin:10px 0">
      <div class="meta">在该机器上运行接入命令(token <span id="countdown">300</span>s 内确认):</div>
      <pre id="cmd"></pre>
      <button onclick="machineConfirm()">确认接入</button>
      <button onclick="machineCancel()">取消</button>
      <button onclick="machineRefresh()">刷新命令</button>
    </div>
    <div id="machine-list" class="meta"></div>
  </div>
  <h2 id="title">发起工作流</h2>
  <div id="launch">
    <input id="wf" class="field" placeholder="工作流 JSON 文件路径（如 examples/e2e-real.json）" />
    <input id="ws" class="field" placeholder="workspace 目录路径（agent 工作的目录）" />
    <textarea id="ctx" class="field" rows="3" placeholder='context JSON（可选）'></textarea>
    <button class="primary" onclick="launch()">运行</button>
  </div>
  <div id="detail" style="display:none">
    <h2 id="runhead"></h2>
    <div id="nodes"></div>
  </div>
</main>
<script>
let ws=null, current=null;
const $=id=>document.getElementById(id);
async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
async function refresh(){const runs=await api('/api/runs');$('runs').innerHTML=runs.map(r=>`<div class="run ${r.id===current?'active':''}" onclick="openRun('${r.id}')">${r.id} · ${r.status}<div class="meta">${r.nodes} 节点 · ${r.createdAt}</div></div>`).join('')}
async function launch(){let ctx;const v=$('ctx').value;if(v){try{ctx=JSON.parse(v)}catch(e){alert('context 不是合法 JSON');return}}
  const j=await api('/api/runs',{method:'POST',body:JSON.stringify({workflowFile:$('wf').value||undefined,workspace:$('ws').value,context:ctx})});openRun(j.runId)}
function openRun(id){current=id;$('title').textContent='Run '+id;$('launch').style.display='none';$('detail').style.display='block';$('runhead').textContent='Run '+id;$('nodes').innerHTML='';if(ws)ws.close()
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/runs/'+id+'/events');
  ws.onmessage=e=>render(JSON.parse(e.data));ws.onclose=()=>refresh();refresh()}
function render(ev){if(!ev.nodeId){refresh();return}
  const status=ev.review?(ev.review.approved?'completed':'rejected'):ev.status;
  let el=document.getElementById('n-'+ev.nodeId);
  if(!el){el=document.createElement('div');el.id='n-'+ev.nodeId;el.className='node';el.innerHTML='<span class="dot"></span><span></span><div style="flex:1"></div><div class="act"></div>';$('nodes').appendChild(el)}
  el.querySelector('.dot').className='dot '+status;
  el.querySelectorAll('span')[1].textContent=ev.nodeId;
  const act=el.querySelector('.act');
  if(ev.review){act.innerHTML=`<span class="meta">${ev.review.approved?'已通过':'已拒绝'}${ev.review.reason?' · '+ev.review.reason:''}</span>`}
  else if(ev.status==='waiting_approval'){act.innerHTML=`<input id="reason-${ev.nodeId}" placeholder="原因(可选)" style="width:140px"/> <button onclick="decide('${ev.nodeId}',true)">通过</button> <button onclick="decide('${ev.nodeId}',false)">拒绝</button>`}
  else{act.innerHTML=''}}
async function decide(node,approve){const reason=$('reason-'+node).value||'';try{await api('/api/runs/'+current+'/approvals/'+node,{method:'POST',body:JSON.stringify({approve,reason})})}catch(e){alert(e.message)}}
// ---- Machines (PRD §5.3.1) ----
let pending=null, countdownTimer=null;
function showView(v){$('launch').style.display=v==='runs'?'block':'none';$('detail').style.display=v==='runs'&&current?'block':'none';$('machines').style.display=v==='machines'?'block':'none';if(v==='machines')loadMachines()}
async function loadMachines(){const ms=await api('/api/machines');$('machine-list').innerHTML=(ms.length?ms.map(x=>`<div>${x.name} · ${x.id} · ${x.online?'<b style="color:var(--ok)">在线</b>':'离线'} · 心跳 ${new Date(x.lastHeartbeatAt).toLocaleTimeString()}</div>`).join(''):'<div>暂无已确认 machine</div>')}
async function machineAdd(){const j=await api('/api/machines/tokens',{method:'POST'});pending=j;$('wizard').style.display='block';showCmd();machineCountdown()}
function machineCountdown(){clearInterval(countdownTimer);let left=300;$('countdown').textContent=left;countdownTimer=setInterval(()=>{left--;$('countdown').textContent=Math.max(0,left);if(left<=0){clearInterval(countdownTimer);alert('接入命令已过期,请刷新')}},1000)}
function showCmd(){const proto=location.protocol==='https:'?'https':'http';$('cmd').textContent=`bun run src/serve.ts --server ${proto}://${location.host} --token ${pending.token}`}
async function machineConfirm(){await api('/api/machines/'+pending.machineId+'/confirm',{method:'POST',body:JSON.stringify({token:pending.token})});clearInterval(countdownTimer);$('wizard').style.display='none';loadMachines()}
async function machineCancel(){if(pending)await api('/api/machines/'+pending.machineId,{method:'DELETE'});clearInterval(countdownTimer);$('wizard').style.display='none';loadMachines()}
async function machineRefresh(){const j=await api('/api/machines/'+pending.machineId+'/refresh-token',{method:'POST'});pending={...pending,token:j.token};showCmd();machineCountdown()}
refresh();setInterval(refresh,2000);
</script>
</body>
</html>
